name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse development APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pan123-android-debug-signing-v1
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode release signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Test, lint and build APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Package APKs and corresponding source
        run: |
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/123pan-next-debug.apk
          cp app/build/outputs/apk/release/app-release.apk build/artifacts/123pan-next-release.apk
          sha256sum build/artifacts/123pan-next-debug.apk build/artifacts/123pan-next-release.apk > build/artifacts/SHA256SUMS
          git archive --format=zip HEAD -o build/artifacts/123pan-next-source.zip
      - name: Verify release APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 123pan-next-apk-${{ github.run_number }}
          path: android/build/artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports and Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/schemas/
          retention-days: 14
